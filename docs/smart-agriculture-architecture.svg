<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#152033" flood-opacity=".10"/></filter>
  <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11Z" fill="#202637"/></marker>
  <style>
    .title{font:700 35px Arial,sans-serif;fill:#172033}.head{font:700 24px Arial,sans-serif;fill:#172033}.body{font:500 20px Arial,sans-serif;fill:#30384b}.small{font:500 17px Arial,sans-serif;fill:#4a5264}.yn{font:700 18px Arial,sans-serif;fill:#172033}
    .box{stroke-width:2.5;rx:16;filter:url(#sh)}.line{stroke:#202637;stroke-width:3;fill:none;marker-end:url(#ar)}.dash{stroke:#202637;stroke-width:3;stroke-dasharray:11 9;fill:none;marker-end:url(#ar)}
  </style>
</defs>
<rect width="1800" height="2500" fill="#fbfcfe"/>
<text x="900" y="55" text-anchor="middle" class="title">SMART AGRICULTURE DECISION SUPPORT SYSTEM</text>
<text x="900" y="88" text-anchor="middle" class="small">Prediction, explainability and context-aware agricultural question answering</text>

<!-- common vertical entry -->
<rect class="box" x="600" y="120" width="600" height="78" fill="#fff8d9" stroke="#e2ad24"/><text x="900" y="169" text-anchor="middle" class="head">USER ACTION</text>
<path class="line" d="M900 198V235"/>
<rect class="box" x="560" y="235" width="680" height="78" fill="#eaf4ff" stroke="#2074ba"/><text x="900" y="284" text-anchor="middle" class="head">STREAMLIT INTERFACE</text>
<path class="line" d="M900 313V350"/>
<rect class="box" x="520" y="350" width="760" height="92" fill="#f2eafd" stroke="#7137a7"/>
<text x="900" y="390" text-anchor="middle" class="head">WORKFLOW ORCHESTRATOR</text><text x="900" y="422" text-anchor="middle" class="small">routes prediction forms and contextual follow-up questions</text>
<path class="line" d="M900 442V480"/>
<rect class="box" x="610" y="480" width="580" height="78" fill="#fff8d9" stroke="#e2ad24"/><text x="900" y="529" text-anchor="middle" class="head">IS A NEW PREDICTION REQUESTED?</text>

<!-- clean branch bus -->
<path class="dash" d="M900 558V602H360V655"/>
<path class="dash" d="M900 558V602H1440V655"/>
<rect x="312" y="606" width="96" height="42" rx="10" fill="#e9f7df" stroke="#4d9a36" stroke-width="2"/><text x="360" y="634" text-anchor="middle" class="yn">YES</text>
<rect x="1392" y="606" width="96" height="42" rx="10" fill="#ffe8e8" stroke="#d74747" stroke-width="2"/><text x="1440" y="634" text-anchor="middle" class="yn">NO</text>

<!-- LEFT LANE: prediction -->
<text x="360" y="690" text-anchor="middle" class="small">PREDICTION WORKFLOW</text>
<rect class="box" x="100" y="715" width="520" height="72" fill="#eaf4ff" stroke="#2074ba"/><text x="360" y="760" text-anchor="middle" class="head">VALIDATE REQUIRED INPUTS</text>
<path class="line" d="M360 787V822"/>
<rect class="box" x="75" y="822" width="570" height="180" fill="#eaf4ff" stroke="#2074ba"/>
<text x="360" y="862" text-anchor="middle" class="head">SELECT AND RUN MODEL</text><line x1="115" y1="886" x2="605" y2="886" stroke="#abc2d6" stroke-width="2"/>
<text x="360" y="922" text-anchor="middle" class="body">Crop → Random Forest</text><text x="360" y="957" text-anchor="middle" class="body">Fertilizer → isolated LightGBM worker</text><text x="360" y="992" text-anchor="middle" class="body">Yield → XGBoost regressor</text>
<path class="line" d="M360 1002V1037"/>
<rect class="box" x="110" y="1037" width="500" height="74" fill="#eaf4ff" stroke="#2074ba"/><text x="360" y="1084" text-anchor="middle" class="head">GENERATE SHAP EXPLANATION</text>
<path class="line" d="M360 1111V1146"/>
<rect class="box" x="95" y="1146" width="530" height="94" fill="#edf8e8" stroke="#478b35"/><text x="360" y="1186" text-anchor="middle" class="head">STORE ACTIVE PREDICTION</text><text x="360" y="1218" text-anchor="middle" class="small">inputs + result + SHAP in session memory</text>
<path class="line" d="M360 1240V1275"/>
<rect class="box" x="110" y="1275" width="500" height="76" fill="#eaf4ff" stroke="#2074ba"/><text x="360" y="1323" text-anchor="middle" class="head">DISPLAY PREDICTION + SHAP</text>
<path class="line" d="M360 1351V1386"/>
<rect class="box" x="105" y="1386" width="510" height="90" fill="#fff0dd" stroke="#d47b22"/><text x="360" y="1425" text-anchor="middle" class="head">WAIT FOR FOLLOW-UP QUESTION</text><text x="360" y="1456" text-anchor="middle" class="small">prediction remains available as context</text>

<!-- RIGHT LANE: follow-up and RAG -->
<text x="1440" y="690" text-anchor="middle" class="small">CONTEXTUAL QUESTION WORKFLOW</text>
<rect class="box" x="1165" y="715" width="550" height="92" fill="#edf8e8" stroke="#478b35"/><text x="1440" y="755" text-anchor="middle" class="head">READ SESSION CONTEXT</text><text x="1440" y="787" text-anchor="middle" class="small">recent messages + active prediction + stored SHAP</text>
<path class="line" d="M1440 807V842"/>
<rect class="box" x="1150" y="842" width="580" height="112" fill="#f2eafd" stroke="#7137a7"/><text x="1440" y="882" text-anchor="middle" class="head">RAG PLANNER ANALYSES QUESTION</text><text x="1440" y="914" text-anchor="middle" class="small">resolves references using the active prediction</text><text x="1440" y="940" text-anchor="middle" class="small">and creates a standalone search query if needed</text>
<path class="line" d="M1440 954V989"/>
<rect class="box" x="1135" y="989" width="610" height="88" fill="#fff8d9" stroke="#e2ad24"/><text x="1440" y="1026" text-anchor="middle" class="head">DOES THE QUESTION REQUIRE FACTUAL</text><text x="1440" y="1057" text-anchor="middle" class="head">AGRICULTURAL KNOWLEDGE?</text>

<!-- RAG yes proceeds straight; no goes to isolated right rail -->
<path class="dash" d="M1440 1077V1122H1190V1162"/>
<path class="dash" d="M1440 1077V1122H1720V1525"/>
<rect x="1142" y="1124" width="96" height="42" rx="10" fill="#e9f7df" stroke="#4d9a36" stroke-width="2"/><text x="1190" y="1152" text-anchor="middle" class="yn">YES</text>
<rect x="1672" y="1124" width="96" height="42" rx="10" fill="#ffe8e8" stroke="#d74747" stroke-width="2"/><text x="1720" y="1152" text-anchor="middle" class="yn">NO</text>

<rect class="box" x="865" y="1162" width="650" height="88" fill="#fff8d9" stroke="#e2ad24"/><text x="1190" y="1199" text-anchor="middle" class="head">IS CURRENT WEATHER OR A LIVE</text><text x="1190" y="1230" text-anchor="middle" class="head">AGROMET ADVISORY REQUESTED?</text>

<!-- second decision with separated outputs -->
<path class="dash" d="M1190 1250V1295H955V1340"/>
<path class="dash" d="M1190 1250V1295H1425V1340"/>
<rect x="907" y="1297" width="96" height="42" rx="10" fill="#e9f7df" stroke="#4d9a36" stroke-width="2"/><text x="955" y="1325" text-anchor="middle" class="yn">YES</text>
<rect x="1377" y="1297" width="96" height="42" rx="10" fill="#ffe8e8" stroke="#d74747" stroke-width="2"/><text x="1425" y="1325" text-anchor="middle" class="yn">NO</text>
<rect class="box" x="770" y="1340" width="370" height="112" fill="#eaf4ff" stroke="#2074ba"/><text x="955" y="1381" text-anchor="middle" class="head">LIVE IMD RETRIEVAL</text><text x="955" y="1413" text-anchor="middle" class="small">fetch current state bulletin on demand</text><text x="955" y="1439" text-anchor="middle" class="small">do not store changing advice in FAISS</text>
<rect class="box" x="1235" y="1340" width="380" height="112" fill="#f2eafd" stroke="#7137a7"/><text x="1425" y="1381" text-anchor="middle" class="head">FAISS RAG RETRIEVER</text><text x="1425" y="1413" text-anchor="middle" class="small">search metadata-rich static chunks</text><text x="1425" y="1439" text-anchor="middle" class="small">normalized MiniLM similarity • Top-K = 4</text>
<rect class="box" x="1605" y="1525" width="170" height="120" fill="#f9eef0" stroke="#cc5262"/><text x="1690" y="1566" text-anchor="middle" class="head">SKIP RAG</text><text x="1690" y="1598" text-anchor="middle" class="small">use session</text><text x="1690" y="1624" text-anchor="middle" class="small">context only</text>

<!-- static KB sits in left lower lane, independent of answer arrows -->
<rect x="85" y="1570" width="650" height="395" rx="18" fill="#fff" stroke="#9ea9b8" stroke-width="2.5" stroke-dasharray="10 8"/>
<text x="410" y="1614" text-anchor="middle" class="head">OFFLINE STATIC KNOWLEDGE PREPARATION</text>
<rect x="125" y="1650" width="570" height="132" rx="14" fill="#fff8d9" stroke="#e2ad24" stroke-width="2"/><text x="410" y="1687" text-anchor="middle" class="body">Official agricultural sources</text><text x="410" y="1720" text-anchor="middle" class="small">ICAR • Vikaspedia • TNAU Agriculture</text><text x="410" y="1748" text-anchor="middle" class="small">TNAU Horticulture</text>
<path class="line" d="M410 1782V1818"/>
<rect x="125" y="1818" width="570" height="112" rx="14" fill="#edf8e8" stroke="#478b35" stroke-width="2"/><text x="410" y="1857" text-anchor="middle" class="body">Extract → clean → metadata-rich chunks</text><text x="410" y="1890" text-anchor="middle" class="small">2,416 chunks → MiniLM embeddings → FAISS index</text><text x="410" y="1917" text-anchor="middle" class="small">index is built and cached at first RAG use</text>
<!-- one clean feed line from offline index to FAISS -->
<path class="dash" d="M695 1874H755V1500H1425V1452"/>

<!-- explicit convergence box; each outcome has its own non-crossing lane -->
<path class="dash" d="M955 1452V1510H840V1700H1120V1740"/>
<path class="dash" d="M1425 1452V1700H1240V1740"/>
<path class="dash" d="M1690 1645V1700H1360V1740"/>
<rect class="box" x="800" y="1740" width="600" height="94" fill="#f4f6f9" stroke="#8c98aa"/><text x="1100" y="1780" text-anchor="middle" class="head">ASSEMBLE ANSWER CONTEXT</text><text x="1100" y="1812" text-anchor="middle" class="small">session context + optional IMD or FAISS evidence</text>
<path class="line" d="M1100 1834V1870"/>
<rect class="box" x="780" y="1870" width="640" height="102" fill="#eaf4ff" stroke="#2074ba"/><text x="1100" y="1911" text-anchor="middle" class="head">GROQ RESPONSE COMPOSER</text><text x="1100" y="1943" text-anchor="middle" class="small">answers from supplied context and avoids unsupported agricultural advice</text>
<path class="line" d="M1100 1972V2008"/>
<rect class="box" x="830" y="2008" width="540" height="78" fill="#edf8e8" stroke="#478b35"/><text x="1100" y="2057" text-anchor="middle" class="head">FINAL CONTEXT-AWARE RESPONSE</text>
<path class="line" d="M1100 2086V2122"/>
<rect class="box" x="785" y="2122" width="630" height="94" fill="#fff0dd" stroke="#d47b22"/><text x="1100" y="2162" text-anchor="middle" class="head">UPDATE CONVERSATION MEMORY</text><text x="1100" y="2194" text-anchor="middle" class="small">store latest user question and assistant response</text>

<rect x="150" y="2290" width="1500" height="125" rx="16" fill="#f4f6f9" stroke="#a9b2c1" stroke-width="2"/>
<text x="900" y="2331" text-anchor="middle" class="head">KEY BEHAVIOUR</text>
<text x="900" y="2368" text-anchor="middle" class="body">Prediction forms run trained models locally. Follow-up questions invoke RAG only when factual knowledge is required.</text>
<text x="900" y="2400" text-anchor="middle" class="body">Static agricultural documents use FAISS; changing IMD advisories are fetched live.</text>
</svg>
